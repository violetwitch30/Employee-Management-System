<div class="container mt-5">
  <h2>Signup</h2>

  <input [(ngModel)]="username" class="form-control mb-2" placeholder="Username" />

  <input [(ngModel)]="email" class="form-control mb-2" placeholder="Email" />

  <input [(ngModel)]="password" class="form-control mb-2" type="password" placeholder="Password" />

  <button class="btn btn-success" (click)="signup()">Signup</button>
</div>
